<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#070a16;--bg2:#0c1124;--sf:rgba(19,26,52,.72);--sf2:#131b38;--ln:rgba(255,255,255,.09);--tx:#f3f5fb;--mu:#9aa4c0;--vi:#7c5cff;--bl:#3b82f6;--cy:#22d3ee;--gr:#34d399;--rd:#f87171;--am:#fbbf24;--g:linear-gradient(135deg,var(--vi),var(--bl));--sh:0 20px 50px -24px rgba(0,0,0,.7);--r:18px;--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
[data-theme=light]{--bg:#f3f5fc;--bg2:#fff;--sf:rgba(255,255,255,.88);--sf2:#fff;--ln:rgba(20,30,80,.1);--tx:#0e1530;--mu:#5a6483;--sh:0 20px 44px -26px rgba(30,40,110,.4);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.6 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 10% -10%,color-mix(in srgb,var(--vi) 24%,transparent),transparent 60%),radial-gradient(800px 520px at 100% 0,color-mix(in srgb,var(--bl) 18%,transparent),transparent 60%),radial-gradient(700px 500px at 50% 115%,color-mix(in srgb,var(--cy) 10%,transparent),transparent 60%)}
h1,h2,h3,h4,.logo b,.big{font-family:"Sora","Manrope",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(2.2rem,6.4vw,4.3rem);line-height:1.06;font-weight:800}
h2{font-size:clamp(1.6rem,4vw,2.5rem);line-height:1.15;font-weight:700}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
a{color:inherit}
.mu{color:var(--mu)}.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:8px}
/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);font:600 .95rem "Manrope",sans-serif;cursor:pointer;text-decoration:none;transition:transform .3s var(--ease),box-shadow .3s,background .3s,border-color .3s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--vi) 60%,transparent)}

.btn.pri{background:var(--g);border-color:transparent;color:#fff;box-shadow:0 10px 28px -10px var(--vi)}
.btn.pri:hover{box-shadow:0 14px 34px -10px var(--vi)}
.btn.ghost{background:transparent}.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}.btn.lg{padding:14px 26px;font-size:1.02rem;border-radius:14px}
.btn.dng{color:var(--rd)}.btn.ic{padding:9px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}

/* inputs */
.inp,select.inp,textarea.inp{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:color-mix(in srgb,var(--bg) 60%,transparent);color:var(--tx);font:inherit;transition:border-color .25s,box-shadow .25s}
.inp:focus{outline:0;border-color:var(--vi);box-shadow:0 0 0 4px color-mix(in srgb,var(--vi) 22%,transparent)}

.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fs{display:grid;gap:14px}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--ln);transition:.3s var(--ease)}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s var(--ease);box-shadow:0 2px 6px #0004}
.sw input:checked+i{background:var(--g)}.sw input:checked+i:after{transform:translateX(20px)}
/* cards */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px;box-shadow:var(--sh);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .4s var(--ease),border-color .3s,box-shadow .3s}
.card.hv:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--vi) 55%,transparent);box-shadow:0 24px 50px -24px var(--vi)}
.ch3{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch3 h3{display:flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:700;background:color-mix(in srgb,var(--vi) 16%,transparent);color:var(--vi)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:99px;border:1px solid var(--ln);background:transparent;color:var(--mu);font:600 .88rem "Manrope",sans-serif;cursor:pointer;transition:.3s var(--ease);position:relative;overflow:hidden}
.chip:hover{color:var(--tx);border-color:var(--vi)}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--ln);overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;background:var(--g);width:0;transition:width 1s var(--ease)}
.bar.gr b{background:linear-gradient(90deg,#34d399,#22d3ee)}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.pop{animation:popin .5s var(--ease) both}
@keyframes popin{from{opacity:0;transform:scale(.92) translateY(10px)}}
/* public layout */
.pubh{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--ln)}
.wrap{max-width:1180px;margin:auto;padding:0 22px}
.nav{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:1.25rem}

.logo b{font-weight:800;letter-spacing:.06em}
.nl{display:flex;gap:4px;margin-left:auto}
.nl a,.nl button{padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--mu);font-weight:600;font-size:.93rem;background:none;border:0;cursor:pointer;font-family:inherit;transition:color .25s,background .25s}
.nl a:hover,.nl button:hover,.nl a.on{color:var(--tx);background:var(--ln)}
.nr{display:flex;gap:10px;align-items:center}
.hb{display:none}
.sec{padding:84px 0}
.sh{text-align:center;max-width:640px;margin:0 auto 46px}.sh p{margin-top:12px;color:var(--mu)}
.eyebrow{display:inline-block;padding:5px 14px;border-radius:99px;border:1px solid var(--ln);font-size:.8rem;font-weight:700;color:var(--cy);margin-bottom:16px;background:color-mix(in srgb,var(--cy) 8%,transparent)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding:70px 0 40px}
.hero p.lead{font-size:1.15rem;color:var(--mu);margin:20px 0 28px;max-width:52ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.trust{margin-top:28px;display:flex;gap:10px;align-items:center;color:var(--mu);font-size:.9rem}
.mock{position:relative;padding:30px 20px}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 9s ease-in-out infinite}
.o1{width:220px;height:220px;background:var(--vi);left:-10px;top:10px}.o2{width:200px;height:200px;background:var(--cy);right:0;bottom:0;animation-delay:-4s;opacity:.35}
.win{position:relative;border-radius:20px;border:1px solid var(--ln);background:color-mix(in srgb,var(--sf2) 92%,transparent);box-shadow:var(--sh),0 0 80px -20px var(--vi);overflow:hidden;transform:perspective(1200px) rotateY(-6deg) rotateX(3deg)}
.wb{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--ln)}.wb i{width:9px;height:9px;border-radius:50%;background:var(--ln)}
.wbody{display:grid;grid-template-columns:54px 1fr;min-height:300px}
.wside{border-right:1px solid var(--ln);padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--mu)}.wside .i:first-child{color:var(--vi)}
.wmain{padding:16px;display:grid;gap:12px}
.wrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ms{padding:10px 12px;border-radius:12px;background:var(--ln)}.ms small{display:block;color:var(--mu);font-size:.7rem}.ms b{font-family:Sora;font-size:1.05rem}
.wchart{display:flex;align-items:flex-end;gap:8px;height:110px;padding:10px;border-radius:12px;background:var(--ln)}
.wchart span{flex:1;border-radius:6px 6px 0 0;background:var(--g);height:var(--h);transform-origin:bottom;animation:grow 1.2s var(--ease) both;animation-delay:calc(var(--i)*90ms + .5s)}
.wt{display:flex;align-items:center;gap:10px;font-size:.85rem;padding:8px 10px;border-radius:10px;background:var(--ln)}.wt i{width:16px;height:16px;border-radius:5px;border:2px solid var(--vi)}.wt i.d{background:var(--gr);border-color:var(--gr)}
.fc{position:absolute;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:color-mix(in srgb,var(--sf2) 94%,transparent);backdrop-filter:blur(10px);box-shadow:var(--sh);font-weight:700;font-size:.88rem;animation:float 7s ease-in-out infinite}
.fc small{display:block;font-weight:500;color:var(--mu);font-size:.72rem}
.c1{left:-4px;top:2px}.c2{right:-6px;top:30%;animation-delay:-2s}.c3{left:6%;bottom:6px;animation-delay:-4s}.c4{right:8%;bottom:-10px;animation-delay:-1s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes grow{from{transform:scaleY(0)}}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fcard .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--vi) 16%,transparent);color:var(--vi);margin-bottom:14px;transition:.4s var(--ease)}
.fcard:hover .ico{background:var(--g);color:#fff;transform:rotate(-6deg) scale(1.08)}
.fcard p{color:var(--mu);font-size:.92rem;margin-top:6px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.stp{text-align:center;position:relative}
.stp:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:var(--g);font:800 1.2rem Sora;color:#fff;box-shadow:0 10px 30px -8px var(--vi)}
.stp p{color:var(--mu);margin-top:8px}
.stats .card{text-align:center}.stats .big{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800}
.tq{font-size:.95rem;color:var(--tx)}.who{display:flex;align-items:center;gap:12px;margin-top:16px}
.av{width:42px;height:42px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:800;color:#fff;font-family:Sora;flex:none;object-fit:cover;overflow:hidden}
.cta{text-align:center;padding:60px 24px;border-radius:28px;background:linear-gradient(135deg,color-mix(in srgb,var(--vi) 30%,var(--sf2)),color-mix(in srgb,var(--bl) 22%,var(--sf2)));border:1px solid var(--ln);position:relative;overflow:hidden}
.cta p{color:var(--mu);margin:12px auto 26px;max-width:52ch}
.foot{border-top:1px solid var(--ln);margin-top:60px;padding:50px 0 30px}
.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:30px}
.fg h4{font-size:.9rem;margin-bottom:12px}.fg a,.fg button{display:block;color:var(--mu);text-decoration:none;padding:4px 0;font-size:.92rem;background:none;border:0;cursor:pointer;font-family:inherit;text-align:left}.fg a:hover,.fg button:hover{color:var(--tx)}
.soc{display:flex;gap:10px;margin-top:14px}.soc a{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;font-weight:800;font-size:.8rem;padding:0;transition:.3s var(--ease)}.soc a:hover{background:var(--g);color:#fff;transform:translateY(-3px)}
.fb{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--ln);color:var(--mu);font-size:.88rem}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0ms)}.rv.vis{opacity:1;transform:none}
.auth{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:30px 0}.auth .card{width:min(440px,100%);padding:32px}
.auth h2{font-size:1.7rem}.auth p.mu{margin:6px 0 22px}.alt{margin-top:18px;text-align:center;color:var(--mu);font-size:.92rem}.alt a{color:var(--cy);font-weight:600}
.err{color:var(--rd);font-size:.85rem;min-height:1.2em}
/* app layout */
.app{display:grid;grid-template-columns:var(--sw,252px) 1fr;min-height:100vh;transition:grid-template-columns .45s var(--ease)}
.app.col{--sw:80px}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--ln);background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:6px;overflow:hidden;z-index:30}
.side .logo{padding:4px 8px 16px}
.nv{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;text-decoration:none;color:var(--mu);font-weight:600;font-size:.93rem;transition:.3s var(--ease);white-space:nowrap;position:relative;border:0;background:none;cursor:pointer;font-family:inherit;width:100%;overflow:hidden}
.nv:hover{background:var(--ln);color:var(--tx);transform:translateX(3px)}
.nv.on{background:linear-gradient(90deg,color-mix(in srgb,var(--vi) 24%,transparent),transparent);color:var(--tx)}
.nv.on:before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--g)}
.nv.on .i{color:var(--cy)}
.nv span,.side .logo b{transition:opacity .25s}
.app.col .nv span,.app.col .logo b,.app.col .sfoot{opacity:0;pointer-events:none}
.sp{flex:1}
.sfoot{padding:12px;border-radius:14px;background:var(--ln);font-size:.82rem;white-space:nowrap}
.mainc{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 26px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--ln)}
.top h2{font-size:1.25rem;margin-right:auto}
.xp{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:99px;background:var(--ln);font-size:.82rem;font-weight:700}.xp .bar{width:70px;height:6px}
.fl{display:flex;align-items:center;gap:5px;font-weight:800;color:var(--am)}
#view{padding:26px;max-width:1240px;width:100%;margin:0 auto;animation:pg .55s var(--ease) both}
@keyframes pg{from{opacity:0;transform:translateY(14px)}}
#view .card{animation:up .6s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.bn{display:none}
.dgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-top:18px}.dgrid>div{display:grid;gap:18px;align-content:start}
.sm4 .card{display:flex;align-items:center;gap:14px}.sm4 .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.sm4 b{font:700 1.5rem Sora;display:block;line-height:1.15}.sm4 small{color:var(--mu)}
.hi{font-size:1.7rem}
/* tasks */
.tk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);margin-bottom:10px;position:relative;transition:transform .3s var(--ease),opacity .4s,border-color .3s;animation:popin .45s var(--ease) both}
.tk:hover{border-color:color-mix(in srgb,var(--vi) 50%,transparent)}
.tk:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--pc)}
.tk[draggable=true]{cursor:grab}.tk.drag{opacity:.4}.tk.over{border-color:var(--cy);transform:translateY(4px)}
.pH{--pc:var(--rd)}.pM{--pc:var(--am)}.pL{--pc:var(--gr)}
.ck{position:relative;width:24px;height:24px;flex:none}
.ck input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.ck i{position:absolute;inset:0;border-radius:8px;border:2px solid var(--mu);transition:.3s var(--ease);display:grid;place-items:center}
.ck i svg{width:14px;height:14px;stroke:#fff;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease) .1s;fill:none}
.ck input:checked+i{background:var(--gr);border-color:var(--gr);transform:scale(1.1)}.ck input:checked+i svg{stroke-dashoffset:0}
.tk.done .tt{text-decoration:line-through;color:var(--mu)}.tk.done{opacity:.65}
.tt{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.meta span{font-size:.75rem;color:var(--mu);display:inline-flex;align-items:center;gap:4px}.meta .i{width:13px;height:13px}
.pri-d{width:9px;height:9px;border-radius:50%;background:var(--pc);box-shadow:0 0 10px var(--pc)}
.acts{display:flex;gap:2px}.acts .btn{padding:7px;border:0;background:none;color:var(--mu)}.acts .btn:hover{color:var(--tx);background:var(--ln)}
.grip{color:var(--mu);cursor:grab}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center}.tools .srch{flex:1;min-width:200px;position:relative}.srch .i{position:absolute;left:12px;top:12px;color:var(--mu)}.srch .inp{padding-left:40px}
/* timer */
.tmr{position:relative;width:var(--sz,200px);aspect-ratio:1;margin:auto}
.tmr svg{width:100%;height:100%;display:block;overflow:visible}
.trk{fill:none;stroke:var(--ln);stroke-width:8}
.tm-ring{fill:none;stroke:url(#rg);stroke-width:8;stroke-linecap:round;stroke-dasharray:565.49;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .5s linear}
.tmc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tm-time{font:800 calc(var(--sz,200px)*.25) Sora,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tm-mode{color:var(--mu);font-weight:600;font-size:.9rem}
.focusing .tm-ring{filter:drop-shadow(0 0 8px var(--vi));animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 18px var(--cy))}}
.tmcard{position:relative;overflow:hidden;text-align:center}
.tmcard:before{content:"";position:absolute;width:70%;aspect-ratio:1;left:15%;top:8%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--vi) 35%,transparent),transparent 70%);opacity:0;transition:opacity 1s}
.focusing .tmcard:before{opacity:1;animation:breathe 5s ease-in-out infinite}

.tmcard>*{position:relative}
.ctl{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:20px}

legal(a){openM(a.dataset.t,`<p class="mu" style="line-height:1.7">${a.dataset.t==='Privacy Policy'?'NEXORA stores your tasks, notes, goals and settings only in your own browser using localStorage. Nothing is sent to a server. Clearing your browser data or using “Reset data” removes it.':'NEXORA is provided as is for personal, educational use. You are responsible for the content you save. Accounts in this demo build are local to your device and are not a secure login system.'}</p>`)},
demo(){loadUser('demo@nexora.app');location.hash='#/dashboard'},
out(){tStop();stopSnd();U=null;D=null;ls.del('nx-session');mode=null;location.hash='#/home';route()},
tgo(){T.run?(tStop(),paint()):tStart()},
trs(){tSet(T.mode)},
tsk(){tSet(T.mode==='work'?'short':'work')},
tm(a){tSet(a.dataset.v)},
fs(){if($('#fsx'))return A.fsx();const d=document.createElement('div');d.id='fsx';d.innerHTML=`<button class="btn ic ghost x" data-a="fsx" aria-label="Exit full screen">${ic('x')}</button>${tmRing(Math.min(420,innerWidth-60))}<div class="ctl"><button class="btn ic ghost" data-a="trs" aria-label="Reset">${ic('reset')}</button><button class="btn pri go tm-go" data-a="tgo" aria-label="Start">${ic('play')}</button><button class="btn ic ghost" data-a="tsk" aria-label="Skip">${ic('skip')}</button></div><p class="mu">Distractions hidden. Press Esc to exit.</p>`;document.body.appendChild(d);try{document.documentElement.requestFullscreen?.()}catch(e){}paint()},
fsx(){$('#fsx')?.remove();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}},
fm(a){const p={deep:[50,10,20],study:[25,5,15],read:[40,8,15]}[a.dataset.v];D.fmode=a.dataset.v;if(p){[D.settings.work,D.settings.short,D.settings.long]=p}save();tSet('work');rerender()},
snd(a){const v=a.dataset.v;S.snd=S.snd===v?'':v;playSnd(S.snd);rerender()},
tgl(a){const t=D.tasks.find(x=>x.id===a.dataset.id);if(!t)return;t.done=a.checked;if(t.done){t.doneOn=dkey();if(!t.xpd){t.xpd=true;gain(10);touch()}toast(t.title,'check','Task completed');badges()}save();const row=a.closest('.tk');row&&row.classList.toggle('done',t.done);chrome();setTimeout(rerender,t.done?520:150)},
tf(a){S.tf=a.dataset.v;rerender()},
tadd(){taskForm()},ted(a){taskForm(D.tasks.find(x=>x.id===a.dataset.id))},
tdel(a){D.tasks=D.tasks.filter(x=>x.id!==a.dataset.id);save();rerender();toast('Task deleted','trash')},
padd(){planForm()},ped(a){planForm(D.plans.find(p=>p.id===a.dataset.id))},
pdel(a){D.plans=D.plans.filter(p=>p.id!==a.dataset.id);save();closeM();rerender()},
pdone(a){const p=D.plans.find(x=>x.id===a.dataset.id);p.done=a.checked;if(p.done){gain(15);touch();toast('Study session done','book','Great job');badges()}save();setTimeout(rerender,300)},
pgen(){genForm()},
pw(a){S.pw+=+a.dataset.v;rerender()},
sadd(){openM('Add subject',`<form class="fs" data-sub="subj"><label class="f">Subject name<input class="inp" name="name" required maxlength="40"></label><label class="f">Colour<input class="inp" type="color" name="c" value="#7c5cff" style="height:46px;padding:4px"></label><button class="btn pri" type="submit">Add subject</button></form>`)},
eadd(a){evForm(null,null,a&&a.dataset&&a.dataset.v)},
cday(a,e){if(e.target.closest('.ev'))return;S.cd=a.dataset.k;if(S.cv==='month'){evForm(null,a.dataset.k)}else evForm(null,a.dataset.k)},
eo(a,e){e.stopPropagation();const k=a.dataset.k,id=a.dataset.id;if(k==='ev')evForm(D.events.find(x=>x.id===id));else if(k==='tk'){location.hash='#/tasks'}else planForm(D.plans.find(x=>x.id===id))},
edel(a){D.events=D.events.filter(x=>x.id!==a.dataset.id);save();closeM();rerender()},
cn(a){const n=+a.dataset.v,d=parse(S.cd);if(S.cv==='month')d.setMonth(d.getMonth()+n,1);else d.setDate(d.getDate()+n*(S.cv==='week'?7:1));S.cd=dkey(d);rerender()},
ctd(){S.cd=dkey();rerender()},cv(a){S.cv=a.dataset.v;rerender()},
nadd(){noteForm()},ned(a,e){if(e.target.closest('[data-a=npin],[data-a=ndel]'))return;noteForm(D.notes.find(n=>n.id===a.dataset.id))},
npin(a,e){e.stopPropagation();const n=D.notes.find(x=>x.id===a.dataset.id);n.pin=!n.pin;save();rerender()},
ndel(a,e){e.stopPropagation();D.notes=D.notes.filter(x=>x.id!==a.dataset.id);save();rerender();toast('Note deleted','trash')},
nfl(a){S.nf=a.dataset.v;rerender()},
fadd(){openM('New folder',`<form class="fs" data-sub="folder"><label class="f">Folder name<input class="inp" name="name" required maxlength="24"></label><button class="btn pri" type="submit">Create folder</button></form>`)},
gadd(){goalForm()},ged(a){goalForm(D.goals.find(g=>g.id===a.dataset.id))},
gdel(a){D.goals=D.goals.filter(g=>g.id!==a.dataset.id);save();rerender()},
gms(a){const g=D.goals.find(x=>x.id===a.dataset.id);g.ms[+a.dataset.i].d=a.checked;goalCheck(g);setTimeout(rerender,a.checked?400:100)},
gp(a){const g=D.goals.find(x=>x.id===a.dataset.id),v=+a.dataset.v;g.prog=v===100?100:Math.max(0,Math.min(100,g.prog+v));goalCheck(g);rerender()},
th(a){setTheme(a.dataset.v);rerender()},ac(a){D.settings.accent=a.dataset.v;accent(a.dataset.v);save();rerender()},
avx(){D.profile.avatar='';save();rerender()},
exp(){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='nexora-data.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),1000)},
rst(){openM('Reset all data?',`<p class="mu" style="margin-bottom:16px">This permanently deletes your tasks, notes, goals, stats and XP on this device.</p><div class="row"><button class="btn dng" data-a="rst2">Yes, reset</button><button class="btn" data-a="mx">Cancel</button></div>`)},
rst2(){const p=D.profile;D=seed(p.name,p.email,false);D.profile=p;save();closeM();tSet('work');rerender();toast('Your data was reset','reset')}
};
const SUB={
login(v,f){const us=ls.get('nx-users',{}),e=v.email.trim().toLowerCase(),u=us[e];if(!u||u.pw!==btoa(unescape(encodeURIComponent(v.pw)))){$('#er').textContent='Incorrect email or password.';return}loadUser(e);toast('Welcome back, '+D.profile.name,'user','Logged in');location.hash='#/dashboard'},
signup(v){const us=ls.get('nx-users',{}),e=v.email.trim().toLowerCase();if(us[e]){$('#er').textContent='An account with this email already exists.';return}us[e]={name:v.name.trim(),pw:btoa(unescape(encodeURIComponent(v.pw)))};ls.set('nx-users',us);loadUser(e);toast('Your account is ready','spark','Welcome to NEXORA');location.hash='#/dashboard'},
forgot(v,f){toast('If an account exists for '+v.email+', a reset link would be sent (demo).','bell','Check your inbox');f.reset()},
task(v,f){const id=f.dataset.id,o={title:v.title.trim(),pr:v.pr,cat:v.cat,due:v.due,dur:+v.dur||0};if(id)Object.assign(D.tasks.find(t=>t.id===id),o);else D.tasks.unshift({id:uid(),done:false,...o});save();closeM();rerender();toast(id?'Task updated':'Task added','tasks','Saved')},
plan(v,f){const id=f.dataset.id,o={sub:v.sub,date:v.date,time:v.time,dur:+v.dur||50,goal:v.goal.trim()};if(id)Object.assign(D.plans.find(p=>p.id===id),o);else D.plans.push({id:uid(),done:false,...o});save();closeM();rerender();toast('Study session saved','book','Planner')},
gen(v){const h=Math.max(1,Math.min(6,+v.h||2)),use=D.subjects.filter(s=>v['s_'+s.id]);if(!use.length){toast('Select at least one subject','book','Planner');return}const t=dkey();D.plans=D.plans.filter(p=>!(p.gen&&p.date>=t&&!p.done));
const w=use.flatMap(s=>{const ex=D.events.some(e=>e.type==='exam'&&e.date>=t&&diff(e.date)<=14&&e.title.toLowerCase().includes(s.name.toLowerCase().slice(0,4)));return Array(ex?2:1).fill(s)});let n=0;const [sh,sm]=(v.t||'17:00').split(':').map(Number);
for(let d=0;d<7;d++){let mins=sh*60+sm;for(let i=0;i<h;i++){const s=w[n++%w.length];D.plans.push({id:uid(),sub:s.id,date:addDays(t,d),time:String(Math.floor(mins/60)%24).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'),dur:50,goal:'',done:false,gen:true});mins+=60}}
save();closeM();S.pw=0;rerender();toast('Your 7-day study plan is ready','spark','Smart Plan');confetti(24)},
subj(v){D.subjects.push({id:uid(),name:v.name.trim(),c:v.c});save();closeM();rerender()},
event(v,f){const id=f.dataset.id;if(!id&&v.type==='task'){D.tasks.unshift({id:uid(),title:v.title.trim(),pr:'M',cat:'School',due:v.date,dur:0,done:false});toast('Added as a task','tasks','Calendar')}else{const o={title:v.title.trim(),type:v.type,date:v.date,time:v.time,notes:v.notes};if(id)Object.assign(D.events.find(e=>e.id===id),o);else D.events.push({id:uid(),...o});toast('Event saved','calendar','Calendar')}save();closeM();S.cd=v.date;rerender()},
note(v,f){const ed=$('#edt');$$('input[type=checkbox]',ed).forEach(i=>i.checked?i.setAttribute('checked',''):i.removeAttribute('checked'));const id=f.dataset.id,o={title:v.title.trim()||'Untitled',folder:v.folder,html:ed.innerHTML,at:Date.now()};if(id)Object.assign(D.notes.find(n=>n.id===id),o);else D.notes.unshift({id:uid(),pin:false,...o});save();closeM();rerender();toast('Note saved','note','Notes')},
folder(v){const n=v.name.trim();if(n&&!D.folders.includes(n))D.folders.push(n);S.nf=n;save();closeM();rerender()},
goal(v,f){const id=f.dataset.id,old=id?D.goals.find(g=>g.id===id):null,lines=v.ms.split('\n').map(x=>x.trim()).filter(Boolean),ms=lines.map(t=>({t,d:!!(old&&old.ms.find(m=>m.t===t&&m.d))})),o={title:v.title.trim(),type:v.type,due:v.due,ms};if(old){Object.assign(old,o);goalCheck(old)}else D.goals.push({id:uid(),prog:0,done:false,...o});save();closeM();rerender();toast('Goal saved','target','Goals')},
profile(v){D.profile.name=v.name.trim()||D.profile.name;const us=ls.get('nx-users',{});if(us[U]){us[U].name=D.profile.name;ls.set('nx-users',us)}save();chrome();toast('Profile updated','user','Settings')}
};
const CH={
dw(el){setDur('work',el)},ds(el){setDur('short',el)},dl(el){setDur('long',el)},pw(el){setDur('work',el)},ps(el){setDur('short',el)},pl(el){setDur('long',el)},
pg(el){const v=Math.max(10,Math.min(720,+el.value||120));D.settings.goal=v;save();toast('Daily goal set to '+fmtH(v),'target','Settings')},
sw(el){D.settings[el.dataset.k]=el.checked;save();if(el.dataset.k==='nBreak'&&el.checked&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission()},
av(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);D.profile.avatar=c.toDataURL('image/jpeg',.8);save();rerender();chrome()};im.src=r.result};r.readAsDataURL(f)}};
function setDur(k,el){const max={work:180,short:60,long:90}[k],v=Math.max(1,Math.min(max,Math.round(+el.value)||D.settings[k]));D.settings[k]=v;el.value=v;save();if(!T.run)tSet(T.mode);else{toast('New length applies to the next session','timer','Settings')}}
const IN={vol(el){S.vol=el.value/100;if(SN)SN.g.gain.value=S.vol*.6},tq(el){S.tq=el.value;keep(el,'tq')},nq(el){S.nq=el.value;keep(el,'nq')}};
function keep(el,k){const p=el.selectionStart;rerender();const n=$(`[data-in=${k}]`);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}}
document.addEventListener('click',e=>{const r=e.target.closest('.btn,.chip,.nv');if(r&&!r.disabled)ripple(r,e);const a=e.target.closest('[data-a]');if(!a)return;if(a.type==='checkbox'||a.tagName==='LABEL')return;const f=A[a.dataset.a];if(f)f(a,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a&&t.type==='checkbox'){const f=A[t.dataset.a];f&&f(t,e)}else if(t.dataset.ch&&CH[t.dataset.ch])CH[t.dataset.ch](t)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.in&&IN[t.dataset.in])IN[t.dataset.in](t)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,h=SUB[f.dataset.sub];if(h)h(Object.fromEntries(new FormData(f)),f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();$('#fsx')&&A.fsx()}if(e.code==='Space'&&cur==='focus'&&!/INPUT|SELECT|TEXTAREA|BUTTON|A/.test(document.activeElement.tagName)&&!$('#modal').classList.contains('open')){e.preventDefault();A.tgo()}if((e.key==='Enter')&&e.target.matches('.note')){e.target.click()}});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeM()});
/* drag & drop tasks */
let dragId=null;
document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('.tk[draggable]');if(!r)return;dragId=r.dataset.id;r.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}});
document.addEventListener('dragover',e=>{const r=e.target.closest&&e.target.closest('.tk[draggable]');if(!r||!dragId)return;e.preventDefault();$$('.tk.over').forEach(x=>x.classList.remove('over'));if(r.dataset.id!==dragId)r.classList.add('over')});
document.addEventListener('drop',e=>{const r=e.target.closest&&e.target.closest('.tk[draggable]');if(!r||!dragId)return;e.preventDefault();const a=D.tasks.findIndex(t=>t.id===dragId),b=D.tasks.findIndex(t=>t.id===r.dataset.id);if(a>-1&&b>-1&&a!==b){const[m]=D.tasks.splice(a,1);D.tasks.splice(b,0,m);save()}dragId=null;rerender()});
document.addEventListener('dragend',()=>{dragId=null;$$('.tk.drag,.tk.over').forEach(x=>x.classList.remove('drag','over'))});
sysDark.addEventListener?.('change',()=>{if(ls.get('nx-theme','dark')==='system')setTheme('system',true)});
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(T.run)tick()});
window.addEventListener('beforeunload',save);
if(U){D=ls.get('nx-d-'+U,null);if(D){tSet('work');accent(D.settings.accent)}else U=null}
if(!location.hash)location.hash='#/home';
route();
})();
</script>
</body>
